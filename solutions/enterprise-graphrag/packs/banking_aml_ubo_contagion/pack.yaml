industry: "Banking & Financial Crime Compliance"
persona: "Head of AML & Sanctions Compliance"
manual_baseline_cost_usd: 850.00
manual_baseline_minutes: 360
default_max_hops: 4
primary_sources:
  - "US Treasury OFAC SDN, ALT & ADD Lists (Explicit Linked To: Graph) — US Gov Public Domain"
  - "GLEIF Global LEI Level-1 & Level-2 Corporate Hierarchies — CC0 1.0 Public Domain"
  - "FinCEN Public Sanctions Evasion Advisories — US Gov Public Domain"
